<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Driventic — Engineer Setup</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    background:#0d1117;color:#e8edf4;
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:24px;
  }
  .card{
    background:#151b25;border:1px solid rgba(255,255,255,.1);
    border-radius:16px;padding:36px 32px;max-width:420px;width:100%;
    text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.4);
  }
  .logo{font-size:28px;font-weight:800;letter-spacing:-.5px;color:#00f1c1;margin-bottom:6px}
  .subtitle{font-size:13px;color:#8896a8;margin-bottom:32px}
  .btn{
    display:block;width:100%;padding:18px;
    background:#00f1c1;color:#0d1117;
    border:none;border-radius:10px;
    font-size:17px;font-weight:700;font-family:inherit;
    cursor:pointer;transition:opacity .15s;
  }
  .btn:active{opacity:.85}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .status{
    margin-top:20px;font-size:14px;line-height:1.5;
    min-height:48px;display:flex;align-items:center;justify-content:center;
  }
  .status.checking{color:#8896a8}
  .status.error{color:#ef4444}
  #screen-setup{display:block}
  #screen-done{display:none;text-align:center}
  #screen-done .icon{font-size:56px;margin-bottom:16px}
  #screen-done h2{font-size:22px;font-weight:700;color:#00f1c1;margin-bottom:10px}
  #screen-done p{font-size:14px;color:#8896a8;line-height:1.6}
</style>
</head>
<body>
<div class="card">

  <div id="screen-setup">
    <div class="logo">Driventic</div>
    <p class="subtitle">Engineer tool first-time setup</p>
    <button class="btn" id="setup-btn" onclick="doSetup()">Get set up</button>
    <div class="status" id="status"></div>
  </div>

  <div id="screen-done">
    <div class="icon">✅</div>
    <h2>You're all set!</h2>
    <p>Setup is complete.<br>Please close this page — you can now open the VOR Tracker.</p>
  </div>

</div>

<script>
  const API_KEY = 'sb_publishable_bpd9qIOrqVxtgcfejgFriQ_QVLYWjuP';
  const SB_URL  = 'https://plekykkdvevqblvdayhm.supabase.co';

  function checkState(){
    const hasKey = !!localStorage.getItem('sb_token');
    document.getElementById('screen-setup').style.display = hasKey ? 'none' : 'block';
    document.getElementById('screen-done').style.display  = hasKey ? 'block' : 'none';
    // Reset button if showing setup screen
    if(!hasKey){
      document.getElementById('setup-btn').disabled = false;
      document.getElementById('status').textContent = '';
      document.getElementById('status').className = 'status';
    }
  }

  async function doSetup(){
    const btn    = document.getElementById('setup-btn');
    const status = document.getElementById('status');

    btn.disabled = true;
    status.className = 'status checking';
    status.textContent = 'Verifying connection…';

    try {
      const r = await fetch(SB_URL+'/storage/v1/object/vor-data/customers.json', {
        headers:{'Authorization':'Bearer '+API_KEY,'apikey':API_KEY}
      });
      if(!r.ok && r.status !== 404){
        throw new Error('Server returned '+r.status+'. Please contact your manager.');
      }
      localStorage.setItem('sb_token', API_KEY);
      checkState();
    } catch(e){
      status.className = 'status error';
      status.textContent = e.message || 'Connection failed. Please contact your manager.';
      btn.disabled = false;
    }
  }

  // Re-check whenever the tab regains focus (e.g. user cleared key elsewhere and came back)
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') checkState();
  });

  // Initial check on page load
  checkState();
</script>
</body>
</html>
